<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlgoMaster - Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="auth-container">
        <div class="auth-box">
            <h1 class="auth-title">Algorithm Master</h1>
            <p class="auth-subtitle">Learn Data Structures & Algorithms Visually</p>

            <!-- Login Form -->
            <div id="login-form" class="auth-form">
                <h2>Login</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter password">
                </div>
                <p id="login-error" class="error-message"></p>
                <button class="auth-btn" onclick="handleLogin()">Login</button>
                <p class="auth-switch">Don't have an account? <span onclick="showSignup()">Sign Up</span></p>
            </div>

            <!-- Signup Form -->
            <div id="signup-form" class="auth-form" style="display: none;">
                <h2>Sign Up</h2>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signup-username" placeholder="Choose username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="signup-email" placeholder="Enter email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" placeholder="Choose password">
                </div>
                <p id="signup-error" class="error-message"></p>
                <p id="signup-success" class="success-message"></p>
                <button class="auth-btn" onclick="handleSignup()">Sign Up</button>
                <p class="auth-switch">Already have an account? <span onclick="showLogin()">Login</span></p>
            </div>

            <!-- Demo Credentials Info -->
            <div class="demo-info">
                <h3>Demo Credentials:</h3>
                <p><strong>User 1:</strong> admin / admin123</p>
                <p><strong>User 2:</strong> student / student123</p>
                <p><strong>User 3:</strong> guest / guest123</p>
            </div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
